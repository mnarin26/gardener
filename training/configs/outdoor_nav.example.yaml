# Example Ultralytics data YAML for outdoor navigation fine-tune.
# After Roboflow download, prefer the data.yaml that ships with the dataset.
# Copy/adapt this only if you assemble a custom folder layout yourself.
#
# Expected layout (YOLOv8-seg):
#   datasets/outdoor_nav/
#     images/train/  images/val/
#     labels/train/  labels/val/
#     data.yaml   <-- usually generated by Roboflow

path: datasets/Cityscapes-10   # change to your downloaded folder name
train: train/images
val: valid/images

# Phase 1 focus classes (subset of Cityscapes-style labels).
# Full Roboflow export may list more names; keep nc/names in sync with labels.
names:
  0: road
  1: sidewalk
  2: wall
  3: fence
  4: building
  5: vegetation
  6: person
  7: car
  # curb_edge / grate (drainage_inlet): NOT in this phase — see README Phase 2
